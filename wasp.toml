# The default build for wasp-os. Modify to customize your own build.
# At least one watch face must be specified. Quick ring apps will be added in order.

[[app]]
file = 'apps/stopwatch/app.py'
quick_ring = true

[[app]]
file = 'apps/heart/app.py'
quick_ring = true

[[app]]
file = 'apps/alarm/app.py'
auto_load = true

[[app]]
file = 'apps/timer/app.py'
auto_load = true

[[app]]
file = 'apps/calculator/app.py'

[[app]]
file = 'apps/disa_b_l_e/app.py'

[[app]] # If only one watch face is included this app can be removed
file = 'apps/faces/app.py'
auto_load = true
no_except = true

[[watchface]]
file = 'faces/clock/app.py'

[[watchface]] # Requires ClockApp to also be installed
file = 'faces/week_clock/app.py'
default = true

[[watchface]]
file = 'faces/chrono/app.py'